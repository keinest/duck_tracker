<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique -- Orange Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/superviseur.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/historique.css') }}">
</head>
<body>

<div class="dashboard-shell">
  <nav class="side-nav">
    <div class="side-brand">
      <div class="mark"><i class="fa-solid fa-location-crosshairs"></i></div>
      DUC <span class="sub">&nbsp;Tracker</span>
    </div>
    <a href="{{ url_for('superviseur_views.accueil') }}" class="nav-link"><i class="fa-solid fa-house"></i> Accueil</a>
    <a href="{{ url_for('superviseur_views.historique_page') }}" class="nav-link active">
    <a href="{{ url_for('superviseur_views.profil') }}" class="nav-link"><i class="fa-solid fa-user"></i> Profil</a>
    <div class="side-nav-footer">
      <a href="#" id="logoutLink" class="nav-link"><i class="fa-solid fa-arrow-right-from-bracket"></i> Déconnexion</a>
    </div>
  </nav>

  <div class="main-area">
    <header class="topbar">
      <div><h1>Historique</h1><div class="topbar-sub" id="resultCount">--</div></div>
    </header>

    <main class="content">

      <div class="filters-bar">
        <div class="period-tabs" id="periodTabs">
          <button class="period-tab" data-periode="jour">Jour</button>
          <button class="period-tab" data-periode="semaine">Semaine</button>
          <button class="period-tab active" data-periode="mois">Mois</button>
          <button class="period-tab" data-periode="tout">Tout</button>
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="date_desc">Plus récent</option>
          <option value="date_asc">Plus ancien</option>
          <option value="distance">Distance</option>
        </select>
      </div>

      <div class="trip-list" id="tripList">
        <div class="empty-state">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <p>Chargement de l'historique...</p>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ============ PANNEAU DÉTAIL (drawer) ============ -->
<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer-panel" id="drawerPanel">
    <div class="drawer-header">
      <div>
        <h2 id="drawerDate">--</h2>
        <span id="drawerTimeRange">--</span>
      </div>
      <button class="icon-btn" id="drawerClose"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="drawer-body">
      <div class="map-visual" id="drawerMap" style="height:220px;border-radius:14px;position:relative;">
        <div id="drawerMapCanvas" style="position:absolute;inset:0;"></div>
        <div class="map-grid"></div>
        <svg id="drawerRoute" viewBox="0 0 400 300" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;"></svg>
      </div>

      <div class="drawer-stats">
        <div class="drawer-stat"><i class="fa-solid fa-clock"></i><b id="drawerDuree">--</b><span>Durée</span></div>
        <div class="drawer-stat"><i class="fa-solid fa-route"></i><b id="drawerDistance">--</b><span>Distance</span></div>
        <div class="drawer-stat"><i class="fa-solid fa-gauge-high"></i><b id="drawerVitesse">--</b><span>Vitesse max</span></div>
        <div class="drawer-stat"><i class="fa-solid fa-flag"></i><b id="drawerArrets">--</b><span>Arrêts</span></div>
      </div>

      <h3 class="drawer-section-title">Points d'arrêt</h3>
      <div class="stop-list" id="stopList"></div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/session-bootstrap.js') }}"></script>
<script src="{{ url_for('static', filename='js/historique.js') }}"></script>
</body>
</html>
