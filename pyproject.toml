[project]
name = "orange-field-tracker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.0",
    "blinker==1.9.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "click==8.4.2",
    "cryptography==50.0.0",
    "Deprecated==1.3.1",
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "Flask-JWT-Extended==4.7.4",
    "Flask-Limiter==4.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "greenlet==3.5.4",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "limits==5.8.0",
    "Mako==1.4.1",
    "MarkupSafe==3.0.3",
    "marshmallow==4.3.0",
    "ordered-set==4.1.0",
    "packaging==26.3",
    "pycparser==3.0",
    "PyJWT==2.13.0",
    "PyMySQL==1.2.0",
    "python-dotenv==1.2.2",
    "SQLAlchemy==2.0.51",
    "typing_extensions==4.16.0",
    "Werkzeug==3.1.8",
    "wrapt==2.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "run:app"